[mod-setting-name]
flh-chat-prefix=Chat trigger prefix
flh-index-chunks-per-tick=Factory index: chunks per tick

[mod-setting-description]
flh-chat-prefix=Chat messages starting with this prefix (case-insensitive) are sent to the helper. Leave blank to only use /flh.
flh-index-chunks-per-tick=How many map chunks the helper's factory index re-summarises per tick (dense chunks count as several, one chunk is about 0.1 ms): changed chunks first, then a round-robin refresh of everything, which keeps statuses current. Higher is fresher on big bases but costs more UPS. 0 pauses the index.

